<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COGNICOO — Навантаження команди</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
::-webkit-scrollbar{height:6px;width:6px}
::-webkit-scrollbar-track{background:#f1f5f9;border-radius:4px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#fff;color:#1e293b;padding:20px 24px;user-select:none}
h1{font-size:20px;font-weight:700;letter-spacing:-.3px;color:#0f172a}
.sub{color:#94a3b8;font-size:12px;margin-top:2px}
.hdr{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.tabs{display:flex;gap:4px;background:#f1f5f9;border-radius:10px;padding:3px}
.tab{border:none;border-radius:8px;padding:7px 16px;cursor:pointer;font-size:12px;font-weight:600;background:none;color:#94a3b8;transition:all .15s}
.tab.on{background:#fff;color:#0f172a;box-shadow:0 1px 3px #0001}
.tab:hover:not(.on){color:#64748b}

.cards{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.tcard{flex:1;min-width:180px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:14px 16px;transition:transform .12s,box-shadow .12s}
.tcard:hover{transform:translateY(-2px);box-shadow:0 3px 10px #0001}
.tcard-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.tcard-dot{width:10px;height:10px;border-radius:50%}
.tcard-stat{font-size:11px;color:#64748b;margin-top:6px}
.tcard-bar{height:6px;border-radius:3px;background:#e2e8f0;margin-top:8px;overflow:hidden}
.tcard-fill{height:100%;border-radius:3px;transition:width .4s}

.inds{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.ind{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px 16px;flex:1;min-width:110px}
.ind-l{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.6px}
.ind-v{font-size:22px;font-weight:700;color:#0f172a;margin-top:2px}

.pipe{display:flex;gap:2px;margin-bottom:18px;border-radius:10px;overflow:hidden;height:32px}
.pipe-seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;min-width:40px;cursor:default}
.pipe-seg span{white-space:nowrap;text-shadow:0 1px 2px #0002}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fchip{border:none;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:11px;font-weight:600;transition:all .12s}
.fchip.off{background:#f1f5f9;color:#94a3b8}
.fchip.off:hover{background:#e2e8f0;color:#64748b}
.fchip.on{color:#fff}

/* ─── TIMELINE GANTT ─── */
.timeline-wrap{overflow-x:auto;margin-bottom:18px;border:1px solid #e2e8f0;border-radius:14px;background:#fafbfc}
.timeline{position:relative;min-width:900px}

.tl-header{display:flex;border-bottom:1px solid #e2e8f0;position:sticky;top:0;background:#f8fafc;z-index:5}
.tl-label-col{width:180px;min-width:180px;padding:10px 14px;font-size:11px;font-weight:600;color:#94a3b8;border-right:1px solid #e2e8f0;flex-shrink:0}
.tl-months{display:flex;flex:1}
.tl-month{flex:1;text-align:center;padding:10px 0;font-size:11px;font-weight:600;color:#64748b;border-right:1px solid #f1f5f9;position:relative}
.tl-month.cur{color:#6366f1;font-weight:700;background:#eef2ff}

/* Team section */
.tl-section{border-bottom:1px solid #e2e8f0}
.tl-section:last-child{border-bottom:none}
.tl-section-hdr{display:flex;align-items:center;padding:8px 14px;background:#f1f5f9;font-size:12px;font-weight:700;gap:8px;cursor:pointer}
.tl-section-hdr:hover{background:#e8ecf1}
.tl-section-dot{width:10px;height:10px;border-radius:50%}

/* Gantt row */
.tl-row{display:flex;min-height:34px;position:relative;border-bottom:1px solid #f8fafc}
.tl-row:hover{background:#f8fafc}
.tl-row-label{width:180px;min-width:180px;padding:7px 14px;font-size:11px;color:#475569;border-right:1px solid #e2e8f0;display:flex;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.tl-row-track{flex:1;position:relative;display:flex}
.tl-row-cell{flex:1;border-right:1px solid #f5f5f5;position:relative}

/* Gantt bar */
.tl-bar{position:absolute;height:22px;top:6px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:10px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;z-index:2;transition:opacity .15s,transform .1s;min-width:16px}
.tl-bar:hover{opacity:.85;transform:scaleY(1.1)}

/* Today marker */
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:#ef4444;z-index:4;pointer-events:none}
.tl-today::before{content:'Сьогодні';position:absolute;top:-20px;left:-24px;font-size:10px;color:#ef4444;font-weight:600;white-space:nowrap}

/* Detail panel */
.detail{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin-bottom:18px;display:none}
.detail.open{display:block}
.det-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.det-title{font-size:15px;font-weight:700;color:#0f172a}
.det-close{border:none;background:#e2e8f0;color:#475569;border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.det-close:hover{background:#cbd5e1}
.det-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.det-person{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px}
.det-pname{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.det-task{font-size:12px;color:#475569;padding:5px 0;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center}
.det-task:last-child{border-bottom:none}
.det-badge{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600}
.weeks{display:flex;gap:4px;margin-top:10px}
.week{flex:1;background:#f1f5f9;border-radius:6px;padding:6px 4px;text-align:center}
.week-lbl{font-size:9px;color:#94a3b8}
.week-v{font-size:14px;font-weight:700;color:#0f172a;margin-top:2px}

.leg{display:flex;gap:12px;font-size:11px;color:#94a3b8;flex-wrap:wrap;margin-top:8px}
.li{display:flex;align-items:center;gap:4px}
.lb{width:14px;height:14px;border-radius:4px}

.tip{position:fixed;background:#0f172a;color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;pointer-events:none;z-index:999;max-width:280px;box-shadow:0 4px 12px #0003;display:none;line-height:1.5}
.tip b{color:#93c5fd}

.loading{text-align:center;padding:40px;color:#94a3b8}
.spin{display:inline-block;width:20px;height:20px;border:3px solid #e2e8f0;border-top-color:#6366f1;border-radius:50%;animation:sp .6s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:16px;color:#dc2626;font-size:13px;margin-bottom:16px}
.info{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:12px 16px;color:#1e40af;font-size:12px;margin-bottom:16px}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <h1>COGNICOO — Навантаження команди</h1>
    <div class="sub" id="subtitle">Завантаження даних...</div>
  </div>
  <div class="tabs" id="viewTabs">
    <button class="tab" onclick="setView('half')">6 міс</button>
    <button class="tab on" onclick="setView('year')">Рік</button>
    <button class="tab" onclick="setView('all')">Все</button>
  </div>
</div>

<div id="error"></div>
<div class="cards" id="teamCards"></div>
<div class="inds" id="indicators"></div>
<div id="pipeline"></div>
<div class="filters" id="filters"></div>
<div class="timeline-wrap" id="timelineWrap"><div class="loading"><span class="spin"></span>Завантаження...</div></div>
<div class="detail" id="detail"></div>
<div class="leg" id="legend"></div>
<div class="tip" id="tip"></div>

<script>
const WORKER_URL = 'https://cognicoo-notion-proxy.alionamakaida.workers.dev/';
const TEAM = ['Андрій', 'Таня', 'Альона'];
const TCOLOR = {'Андрій': '#6366f1', 'Таня': '#10b981', 'Альона': '#ec4899'};
const TBAR = {'Андрій': '#a5b4fc', 'Таня': '#6ee7b7', 'Альона': '#f9a8d4'};
const TBAR_DARK = {'Андрій': '#818cf8', 'Таня': '#34d399', 'Альона': '#f472b6'};
const STATUS_ORDER = ['Backlog', 'in process', 'Перевірка', 'Підтверджено', 'Done all'];
const STATUS_UA = {'Backlog':'Запит','in process':'В роботі','Перевірка':'Перевірка','Підтверджено':'Підтверджено','Done all':'Виконано'};
const STATUS_CLR = {'Backlog':'#94a3b8','in process':'#6366f1','Перевірка':'#f59e0b','Підтверджено':'#22c55e','Done all':'#10b981'};
const MONTHS_UA = ['Січ','Лют','Бер','Кві','Тра','Чер','Лип','Сер','Вер','Жов','Лис','Гру'];
const MONTHS_FULL = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];

let allTasks = [];
let view = 'year';
let filterTeam = new Set(TEAM);
const NOW = new Date();
const CUR_YEAR = NOW.getFullYear();
const CUR_MONTH = NOW.getMonth();

// ─── DATA ───
async function loadData() {
  if (WORKER_URL) {
    try {
      const r = await fetch(WORKER_URL);
      if (r.ok) {
        const d = await r.json();
        allTasks = d.tasks || [];
        document.getElementById('subtitle').textContent = `${allTasks.length} задач · оновлено ${new Date(d.fetched).toLocaleString('uk-UA')}`;
        render();
        return;
      }
    } catch(e) { console.warn('Worker error:', e); }
  }
  document.getElementById('error').innerHTML = '<div class="info">ℹ️ Не вдалося підключитися до Notion. Показані демо-дані.</div>';
  loadDemo();
}

function loadDemo() {
  allTasks = [
    {id:1,name:'Soft Sich профілі',team:['Альона'],status:'Перевірка',start:'2026-03-29',end:null,clients:['Soft Sich'],priority:'Medium',tags:[]},
    {id:2,name:'CastDev клієнтів',team:['Таня'],status:'in process',start:'2026-02-01',end:null,clients:['Cognicoo'],priority:'',tags:[]},
    {id:3,name:'Gallup Analytics',team:['Альона'],status:'in process',start:'2026-03-26',end:null,clients:['Cognicoo'],priority:'',tags:[]},
  ];
  document.getElementById('subtitle').textContent = 'Демо-дані';
  render();
}

// ─── HELPERS ───
function parseDate(s) { return s ? new Date(s) : null; }
function monthKey(y, m) { return y * 12 + m; }
function activeTasks() { return allTasks.filter(t => filterTeam.size === 0 || t.team.some(m => filterTeam.has(m))); }

// Build projects: group tasks by client + member (each member gets their own bar)
function buildProjects() {
  const map = {};
  activeTasks().forEach(t => {
    const cList = t.clients && t.clients.length ? t.clients : ['Інше'];
    const members = t.team.length ? t.team : ['—'];
    cList.forEach(c => {
      members.forEach(m => {
        const key = c + '||' + m;
        if (!map[key]) map[key] = { name: c, member: m, tasks: [], startDates: [], endDates: [], statuses: new Set() };
        map[key].tasks.push(t);
        if (t.start) map[key].startDates.push(new Date(t.start));
        if (t.end) map[key].endDates.push(new Date(t.end));
        else if (t.start) map[key].endDates.push(new Date(t.start));
        map[key].statuses.add(t.status);
      });
    });
  });
  return Object.values(map).map(p => {
    const allDates = [...p.startDates, ...p.endDates];
    if (allDates.length) {
      p.startDate = p.startDates.length ? new Date(Math.min(...p.startDates)) : new Date(Math.min(...allDates));
      p.endDate = p.endDates.length ? new Date(Math.max(...p.endDates)) : new Date(Math.max(...allDates));
      if (p.endDate - p.startDate < 7*24*3600*1000) {
        p.endDate = new Date(p.endDate.getTime() + 14*24*3600*1000);
      }
    } else {
      p.startDate = new Date(CUR_YEAR, CUR_MONTH, 1);
      p.endDate = new Date(CUR_YEAR, CUR_MONTH + 1, 15);
    }
    p.active = p.tasks.some(t => ['in process', 'Перевірка', 'Backlog'].includes(t.status));
    return p;
  }).sort((a,b) => a.startDate - b.startDate);
}

// Get visible months range
function getMonthRange() {
  if (view === 'half') {
    const s = monthKey(CUR_YEAR, CUR_MONTH) - 2;
    return { start: s, count: 6 };
  } else if (view === 'year') {
    // From 3 months ago to 9 months ahead
    const s = monthKey(CUR_YEAR, CUR_MONTH) - 3;
    return { start: s, count: 13 };
  } else {
    // All — find min/max from projects
    const projects = buildProjects();
    let minM = monthKey(CUR_YEAR, CUR_MONTH) - 3;
    let maxM = monthKey(CUR_YEAR, CUR_MONTH) + 9;
    projects.forEach(p => {
      const sm = monthKey(p.startDate.getFullYear(), p.startDate.getMonth());
      const em = monthKey(p.endDate.getFullYear(), p.endDate.getMonth());
      if (sm < minM) minM = sm;
      if (em > maxM) maxM = em;
    });
    return { start: minM - 1, count: maxM - minM + 3 };
  }
}

function monthLabel(mk) {
  const y = Math.floor(mk / 12);
  const m = mk % 12;
  return MONTHS_UA[m] + ' ' + y;
}

// ─── RENDER ───
function render() {
  renderTeamCards();
  renderIndicators();
  renderPipeline();
  renderFilters();
  renderTimeline();
  renderLegend();
}

function setView(v) {
  view = v;
  document.querySelectorAll('.tab').forEach(b => {
    b.classList.toggle('on', (v==='half' && b.textContent==='6 міс') || (v==='year' && b.textContent==='Рік') || (v==='all' && b.textContent==='Все'));
  });
  render();
}

// ─── TEAM CARDS ───
function renderTeamCards() {
  let h = '';
  TEAM.forEach(m => {
    if (!filterTeam.has(m)) return;
    const tasks = allTasks.filter(t => t.team.includes(m));
    const active = tasks.filter(t => t.status === 'in process' || t.status === 'Перевірка');
    const done = tasks.filter(t => t.status === 'Done all' || t.status === 'Підтверджено');
    const pct = tasks.length ? Math.round(done.length / tasks.length * 100) : 0;
    h += `<div class="tcard">
      <div class="tcard-name"><span class="tcard-dot" style="background:${TCOLOR[m]}"></span>${m}</div>
      <div class="tcard-stat">${active.length} активних · ${tasks.length} всього</div>
      <div class="tcard-bar"><div class="tcard-fill" style="width:${pct}%;background:${TBAR_DARK[m]}"></div></div>
      <div class="tcard-stat">${pct}% виконано (${done.length}/${tasks.length})</div>
    </div>`;
  });
  document.getElementById('teamCards').innerHTML = h;
}

function renderIndicators() {
  const t = activeTasks();
  const active = t.filter(x => x.status === 'in process').length;
  const review = t.filter(x => x.status === 'Перевірка').length;
  const done = t.filter(x => x.status === 'Done all' || x.status === 'Підтверджено').length;
  const clients = new Set(t.flatMap(x => x.clients)).size;
  document.getElementById('indicators').innerHTML = `
    <div class="ind"><div class="ind-l">Всього</div><div class="ind-v">${t.length}</div></div>
    <div class="ind"><div class="ind-l">В роботі</div><div class="ind-v" style="color:#6366f1">${active}</div></div>
    <div class="ind"><div class="ind-l">Перевірка</div><div class="ind-v" style="color:#f59e0b">${review}</div></div>
    <div class="ind"><div class="ind-l">Виконано</div><div class="ind-v" style="color:#22c55e">${done}</div></div>
    <div class="ind"><div class="ind-l">Клієнтів</div><div class="ind-v">${clients}</div></div>`;
}

function renderPipeline() {
  const t = activeTasks();
  const total = t.length || 1;
  let h = '<div class="pipe">';
  STATUS_ORDER.forEach(s => {
    const cnt = t.filter(x => x.status === s).length;
    if (cnt === 0) return;
    const pct = Math.max(cnt / total * 100, 5);
    h += `<div class="pipe-seg" style="flex:${pct};background:${STATUS_CLR[s]}"><span>${STATUS_UA[s]} ${cnt}</span></div>`;
  });
  h += '</div>';
  document.getElementById('pipeline').innerHTML = h;
}

function renderFilters() {
  let h = '';
  TEAM.forEach(m => {
    const on = filterTeam.has(m);
    h += `<button class="fchip ${on?'on':'off'}" style="${on?'background:'+TCOLOR[m]:''}" onclick="toggleFilter('${m}')">${m}</button>`;
  });
  h += `<button class="fchip ${filterTeam.size===TEAM.length?'on':'off'}" style="${filterTeam.size===TEAM.length?'background:#64748b':''}" onclick="toggleAll()">Всі</button>`;
  document.getElementById('filters').innerHTML = h;
}

function toggleFilter(m) {
  if (filterTeam.has(m)) filterTeam.delete(m); else filterTeam.add(m);
  if (filterTeam.size === 0) TEAM.forEach(t => filterTeam.add(t));
  render();
}
function toggleAll() {
  if (filterTeam.size === TEAM.length) { filterTeam.clear(); filterTeam.add(TEAM[0]); }
  else TEAM.forEach(t => filterTeam.add(t));
  render();
}

// ─── TIMELINE ───
function renderTimeline() {
  const projects = buildProjects();
  const range = getMonthRange();
  const { start: startMK, count: mCount } = range;
  const curMK = monthKey(CUR_YEAR, CUR_MONTH);

  // Group projects by member (each project already has a specific member)
  const groups = {};
  TEAM.forEach(m => { if (filterTeam.has(m)) groups[m] = []; });
  projects.forEach(p => {
    const m = p.member;
    if (groups[m]) groups[m].push(p);
  });

  // Calculate today position
  const todayMK = curMK + (NOW.getDate() - 1) / 30;
  const todayPct = ((todayMK - startMK) / mCount) * 100;

  let h = '<div class="timeline" style="position:relative">';

  // Month header
  h += '<div class="tl-header"><div class="tl-label-col">Проєкт / Клієнт</div><div class="tl-months">';
  for (let i = 0; i < mCount; i++) {
    const mk = startMK + i;
    const isCur = mk === curMK;
    h += `<div class="tl-month${isCur ? ' cur' : ''}" onclick="showMonthDetail(${mk % 12}, ${Math.floor(mk/12)})">${monthLabel(mk)}</div>`;
  }
  h += '</div></div>';

  // Team sections
  TEAM.forEach(member => {
    if (!groups[member] || !filterTeam.has(member)) return;
    const memberProjects = groups[member];

    h += `<div class="tl-section">`;
    h += `<div class="tl-section-hdr"><span class="tl-section-dot" style="background:${TCOLOR[member]}"></span>${member} <span style="color:#94a3b8;font-weight:400;font-size:11px">(${memberProjects.length} проєктів)</span></div>`;

    memberProjects.forEach(p => {
      const pStartMK = monthKey(p.startDate.getFullYear(), p.startDate.getMonth()) + (p.startDate.getDate()-1)/30;
      const pEndMK = monthKey(p.endDate.getFullYear(), p.endDate.getMonth()) + (p.endDate.getDate()-1)/30;

      const leftPct = Math.max(0, ((pStartMK - startMK) / mCount) * 100);
      const rightPct = Math.min(100, ((pEndMK - startMK) / mCount) * 100);
      const widthPct = Math.max(rightPct - leftPct, 2);

      const barColor = p.active ? TBAR[member] : TBAR[member] + '88';
      const taskInfo = JSON.stringify({name:p.name,team:[p.member],tasks:p.tasks.length,active:p.tasks.filter(t=>['in process','Перевірка'].includes(t.status)).length,status:[...p.statuses]}).replace(/"/g,'&quot;');

      h += `<div class="tl-row">
        <div class="tl-row-label" title="${p.name}">${p.name}</div>
        <div class="tl-row-track">`;

      // Grid lines
      for (let i = 0; i < mCount; i++) {
        h += `<div class="tl-row-cell"></div>`;
      }

      // Bar
      h += `<div class="tl-bar" style="left:${leftPct}%;width:${widthPct}%;background:${barColor}"
                 onmouseenter="showProjectTip(event, this)" onmouseleave="hideTip()"
                 data-info="${taskInfo}">${p.name}</div>`;

      h += '</div></div>';
    });

    // If no projects
    if (memberProjects.length === 0) {
      h += '<div class="tl-row"><div class="tl-row-label" style="color:#94a3b8">Немає проєктів</div><div class="tl-row-track">';
      for (let i = 0; i < mCount; i++) h += '<div class="tl-row-cell"></div>';
      h += '</div></div>';
    }

    h += '</div>';
  });

  // Today marker
  if (todayPct > 0 && todayPct < 100) {
    const leftOffset = 180; // label column width
    h += `<div class="tl-today" style="left:calc(180px + ${todayPct}% * (100% - 180px) / 100%)"></div>`;
  }

  h += '</div>';

  // Fix today line position with JS after render
  document.getElementById('timelineWrap').innerHTML = h;

  // Position today line correctly
  requestAnimationFrame(() => {
    const timeline = document.querySelector('.timeline');
    const track = document.querySelector('.tl-row-track');
    const label = document.querySelector('.tl-label-col');
    if (timeline && track && label) {
      const labelW = label.offsetWidth;
      const trackW = track.offsetWidth;
      const todayX = labelW + (todayPct / 100) * trackW;
      const todayEl = document.querySelector('.tl-today');
      if (todayEl) {
        todayEl.style.left = todayX + 'px';
      }
    }
  });
}

// ─── MONTH DETAIL (mini-timeline with weeks) ───
function showMonthDetail(mi, yr) {
  const el = document.getElementById('detail');
  el.classList.add('open');

  // 4 weeks + days in month
  const monthStart = new Date(yr, mi, 1);
  const monthEnd = new Date(yr, mi + 1, 0);
  const daysInMonth = monthEnd.getDate();
  const weeks = [];
  for (let w = 0; w < 4; w++) {
    const d1 = w * 7 + 1;
    const d2 = w === 3 ? daysInMonth : (w + 1) * 7;
    weeks.push({ label: `${d1}-${d2} ${MONTHS_UA[mi]}`, d1, d2 });
  }

  // Get tasks for this month per member
  function tasksInMonth(member) {
    return allTasks.filter(t => {
      if (!t.team.includes(member)) return false;
      const s = t.start ? new Date(t.start) : null;
      const e = t.end ? new Date(t.end) : s;
      if (!s) return mi === CUR_MONTH && yr === CUR_YEAR;
      // Task overlaps with this month?
      const ms = new Date(yr, mi, 1);
      const me = new Date(yr, mi + 1, 0);
      return s <= me && (e || s) >= ms;
    });
  }

  let h = `<div class="det-hdr">
    <div class="det-title">📅 ${MONTHS_FULL[mi]} ${yr}</div>
    <button class="det-close" onclick="hideDetail()">✕</button>
  </div>`;

  // Mini timeline
  h += '<div class="timeline" style="position:relative">';

  // Week header
  h += '<div class="tl-header"><div class="tl-label-col">Задача</div><div class="tl-months">';
  weeks.forEach((w, i) => {
    // Highlight current week
    const today = new Date();
    const isCur = today.getFullYear() === yr && today.getMonth() === mi && today.getDate() >= w.d1 && today.getDate() <= w.d2;
    h += `<div class="tl-month${isCur ? ' cur' : ''}">${w.label}</div>`;
  });
  h += '</div></div>';

  // Sections per team member
  TEAM.forEach(member => {
    if (!filterTeam.has(member)) return;
    const tasks = tasksInMonth(member);

    h += '<div class="tl-section">';
    h += `<div class="tl-section-hdr"><span class="tl-section-dot" style="background:${TCOLOR[member]}"></span>${member} <span style="color:#94a3b8;font-weight:400;font-size:11px">(${tasks.length} задач)</span></div>`;

    if (tasks.length === 0) {
      h += '<div class="tl-row"><div class="tl-row-label" style="color:#94a3b8;font-style:italic">Вільний</div><div class="tl-row-track">';
      for (let i = 0; i < 4; i++) h += '<div class="tl-row-cell"></div>';
      h += '</div></div>';
    } else {
      tasks.forEach(t => {
        const s = t.start ? new Date(t.start) : new Date(yr, mi, 1);
        const e = t.end ? new Date(t.end) : (t.start ? new Date(t.start) : new Date(yr, mi, 7));

        // Position within month (0 to daysInMonth)
        const taskDay1 = Math.max(1, s.getMonth() === mi && s.getFullYear() === yr ? s.getDate() : 1);
        const taskDay2 = Math.min(daysInMonth, e.getMonth() === mi && e.getFullYear() === yr ? e.getDate() : daysInMonth);

        const leftPct = ((taskDay1 - 1) / daysInMonth) * 100;
        const widthPct = Math.max(((taskDay2 - taskDay1 + 1) / daysInMonth) * 100, 3);

        const barColor = TBAR[member];
        const statusClr = STATUS_CLR[t.status] || '#94a3b8';
        const label = t.name.length > 35 ? t.name.slice(0, 33) + '…' : t.name;
        const tipData = JSON.stringify({name:t.name,team:[member],tasks:1,active:['in process','Перевірка'].includes(t.status)?1:0,status:[t.status]}).replace(/"/g,'&quot;');

        h += `<div class="tl-row">
          <div class="tl-row-label" title="${t.name}">
            <span class="det-badge" style="background:${statusClr}22;color:${statusClr};margin-right:6px;font-size:9px">${STATUS_UA[t.status] || t.status}</span>
            ${t.clients && t.clients[0] ? t.clients[0] : ''}
          </div>
          <div class="tl-row-track">`;

        for (let i = 0; i < 4; i++) h += '<div class="tl-row-cell"></div>';

        h += `<div class="tl-bar" style="left:${leftPct}%;width:${widthPct}%;background:${barColor}"
                   onmouseenter="showProjectTip(event,this)" onmouseleave="hideTip()"
                   data-info="${tipData}">${label}</div>`;
        h += '</div></div>';
      });
    }
    h += '</div>';
  });

  // Today marker in month view
  const today = new Date();
  if (today.getFullYear() === yr && today.getMonth() === mi) {
    const todayPct = ((today.getDate() - 1) / daysInMonth) * 100;
    h += `<div class="tl-today" style="pointer-events:none"></div>`;
    // Position after render
    requestAnimationFrame(() => {
      const track = el.querySelector('.tl-row-track');
      const label = el.querySelector('.tl-label-col');
      const todayLine = el.querySelector('.tl-today');
      if (track && label && todayLine) {
        todayLine.style.left = (label.offsetWidth + (todayPct / 100) * track.offsetWidth) + 'px';
      }
    });
  }

  h += '</div>';
  el.innerHTML = h;
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function hideDetail() { document.getElementById('detail').classList.remove('open'); }

// ─── LEGEND ───
function renderLegend() {
  let h = '';
  TEAM.forEach(m => { h += `<div class="li"><div class="lb" style="background:${TBAR[m]}"></div>${m}</div>`; });
  h += '<span style="margin:0 8px;color:#cbd5e1">|</span>';
  STATUS_ORDER.forEach(s => { h += `<div class="li"><div class="lb" style="background:${STATUS_CLR[s]}"></div>${STATUS_UA[s]}</div>`; });
  document.getElementById('legend').innerHTML = h;
}

// ─── TOOLTIPS ───
function showProjectTip(e, el) {
  const info = JSON.parse(el.dataset.info);
  const tip = document.getElementById('tip');
  tip.innerHTML = `<b>${info.name}</b><br>👥 ${info.team.join(', ')}<br>📋 ${info.tasks} задач (${info.active} активних)<br>📊 ${info.status.map(s => STATUS_UA[s]||s).join(', ')}`;
  tip.style.display = 'block';
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + 280 > window.innerWidth) x = e.clientX - 290;
  if (y + 120 > window.innerHeight) y = e.clientY - 130;
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
}

function hideTip() { document.getElementById('tip').style.display = 'none'; }

// ─── AUTO-REFRESH ───
setInterval(loadData, 5 * 60 * 1000);

// ─── INIT ───
loadData();
</script>
</body>
